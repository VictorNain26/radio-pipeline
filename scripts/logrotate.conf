# Logrotate configuration for AubeSonore radio-pipeline.
#
# Install :
#   sudo cp scripts/logrotate.conf /etc/logrotate.d/radio-pipeline
#   sudo logrotate -d /etc/logrotate.d/radio-pipeline   # dry-run check
#
# `copytruncate` is mandatory: run.sh uses `tee -a` which keeps the file
# descriptor open. A plain rename would leave bash writing to the rotated
# file silently.

/home/victormoi/radio/pipeline/cron.log
/home/victormoi/radio/pipeline/pipeline.log
/home/victormoi/radio/pipeline/ytdlp-update.log
/home/victormoi/radio/pipeline/reanalyze_full.log
{
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su victormoi victormoi
}
